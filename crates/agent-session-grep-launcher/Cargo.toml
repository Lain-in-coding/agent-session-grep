[package]
name = "agent-session-grep-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
semver = "=1.0.28"
sha2 = "=0.10.9"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
