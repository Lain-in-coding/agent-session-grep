      - name: Validate target inventories before assembling
        id: assemble_artifacts
        shell: python {0}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          def validate_version(value):
              if not isinstance(value, str) or not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
                  r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", value
              ):
                  raise ValueError("version must be a canonical SemVer archive component")
              prerelease = value.split("+", 1)[0].partition("-")[2]
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise ValueError("numeric prerelease identifiers cannot have leading zeroes")
              return value

          def validate_tag(tag):
              if not isinstance(tag, str) or not tag.startswith("v"):
                  raise ValueError("release tag must be v<version>")
              validate_version(tag[1:])
              return tag

          import hashlib
          import json
          from pathlib import Path

          TARGETS = {
              "x86_64-pc-windows-msvc": ("zip", "agent-session-grep.exe"),
              "x86_64-unknown-linux-gnu": ("tar.gz", "agent-session-grep"),
              "x86_64-apple-darwin": ("tar.gz", "agent-session-grep"),
              "aarch64-apple-darwin": ("tar.gz", "agent-session-grep"),
          }
          DEPENDENCIES = ("THIRD-PARTY-DEPENDENCIES.json", "THIRD-PARTY-DEPENDENCIES.csv")
          DOCUMENTS = ("README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def hash_stream(handle):
              digest, size = hashlib.sha256(), 0
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
                  size += len(chunk)
              return digest.hexdigest(), size

          def sha256_file(path):
              with Path(path).open("rb") as handle:
                  return hash_stream(handle)[0]

          def require_files(root, expected):
              root = Path(root)
              if root.is_symlink() or not root.is_dir():
                  raise ValueError("artifact directory is missing or linked")
              files = list(root.iterdir())
              if {path.name for path in files} != set(expected) or any(path.is_symlink() or not path.is_file() for path in files):
                  raise ValueError("artifact file inventory does not exactly match the contract")

          def validate_checksums(root, expected):
              root = Path(root)
              require_files(root, {*expected, "SHA256SUMS"})
              found = set()
              for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  if not match or match[2] not in expected or match[2] in found:
                      raise ValueError("malformed, duplicate or unexpected checksum entry")
                  found.add(match[2])
                  if sha256_file(root / match[2]) != match[1]:
                      raise ValueError("artifact checksum mismatch")
              if found != set(expected):
                  raise ValueError("checksum inventory is incomplete")

          import os
          import shutil

          def assemble_artifacts(artifact_root, input_root, output_root, prefix, tag):
              validate_tag(tag)
              if not isinstance(prefix, str) or not re.fullmatch(r"[A-Za-z0-9-]+-", prefix):
                  raise ValueError("invalid artifact prefix")
              artifact_root, input_root, output_root = map(Path, (artifact_root, input_root, output_root))
              expected_directories = {prefix + target for target in TARGETS}
              if artifact_root.is_symlink() or not artifact_root.is_dir():
                  raise ValueError("target artifact root is missing or linked")
              directories = list(artifact_root.iterdir())
              if ({path.name for path in directories} != expected_directories
                      or any(path.is_symlink() or not path.is_dir() for path in directories)):
                  raise ValueError("expected exactly four target artifact directories")
              require_files(input_root, DEPENDENCIES)
              sources = [input_root / name for name in DEPENDENCIES]
              for target, (archive_format, _) in TARGETS.items():
                  base = f"agent-session-grep-{tag}-{target}"
                  names = {base + "." + archive_format, base + ".manifest.json"}
                  folder = artifact_root / (prefix + target)
                  validate_checksums(folder, names)
                  sources.extend(folder / name for name in sorted(names))
              # Never merge download directories or overwrite colliding candidate files.
              output_root.mkdir()
              for source in sources:
                  with source.open("rb") as incoming, (output_root / source.name).open("xb") as outgoing:
                      shutil.copyfileobj(incoming, outgoing)

          if __name__ == "__main__":
              assemble_artifacts("artifacts", "release-inputs", "dist", os.environ["ARTIFACT_PREFIX"], os.environ["RELEASE_TAG"])

