              prerelease = value.split("+", 1)[0].partition("-")[2]
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise ValueError("numeric prerelease identifiers cannot have leading zeroes")
              return value

          def validate_tag(tag):
              if not isinstance(tag, str) or not tag.startswith("v"):
                  raise ValueError("release tag must be v<version>")
              validate_version(tag[1:])
              return tag

          import hashlib
          import json
          from pathlib import Path

          TARGETS = {
              "x86_64-pc-windows-msvc": ("zip", "agent-session-grep.exe"),
              "x86_64-unknown-linux-gnu": ("tar.gz", "agent-session-grep"),
              "x86_64-apple-darwin": ("tar.gz", "agent-session-grep"),
              "aarch64-apple-darwin": ("tar.gz", "agent-session-grep"),
          }
          DEPENDENCIES = ("THIRD-PARTY-DEPENDENCIES.json", "THIRD-PARTY-DEPENDENCIES.csv")
          DOCUMENTS = ("README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def hash_stream(handle):
              digest, size = hashlib.sha256(), 0
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
                  size += len(chunk)
              return digest.hexdigest(), size

          def sha256_file(path):
              with Path(path).open("rb") as handle:
                  return hash_stream(handle)[0]

          def require_files(root, expected):
              root = Path(root)
              if root.is_symlink() or not root.is_dir():
                  raise ValueError("artifact directory is missing or linked")
              files = list(root.iterdir())
              if {path.name for path in files} != set(expected) or any(path.is_symlink() or not path.is_file() for path in files):
                  raise ValueError("artifact file inventory does not exactly match the contract")

          def validate_checksums(root, expected):
              root = Path(root)
              require_files(root, {*expected, "SHA256SUMS"})
              found = set()
              for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  if not match or match[2] not in expected or match[2] in found:
                      raise ValueError("malformed, duplicate or unexpected checksum entry")
                  found.add(match[2])
                  if sha256_file(root / match[2]) != match[1]:
                      raise ValueError("artifact checksum mismatch")
              if found != set(expected):
                  raise ValueError("checksum inventory is incomplete")

          import tarfile
          import time
          import zipfile

          def validate_archive_members(path, archive, binary, dependency_hashes, source_date_epoch):
              root = archive["root"]
              modes = {root + "/" + name: "0644" for name in (*DOCUMENTS, *DEPENDENCIES)}
              modes[root + "/" + binary] = "0755"
              records = archive.get("files")
              if not isinstance(records, list) or len(records) != len(modes):
                  raise ValueError("archive member manifest is incomplete")
              by_name = {}
              for record in records:
                  if not isinstance(record, dict) or set(record) != {"name", "mode", "size_bytes", "sha256"}:
                      raise ValueError("malformed archive member manifest")
                  name = record["name"]
                  if not isinstance(name, str) or name not in modes or name in by_name:
                      raise ValueError("unexpected or duplicate archive member path")
                  if (record["mode"] != modes[name] or type(record["size_bytes"]) is not int or record["size_bytes"] < 0
                          or not isinstance(record["sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", record["sha256"])):
                      raise ValueError("invalid archive member metadata")
                  leaf = name.split("/")[-1]
                  if leaf in dependency_hashes and record["sha256"] != dependency_hashes[leaf]:
                      raise ValueError("archive dependency inventory does not match the common inputs")
                  by_name[name] = record
              if set(by_name) != set(modes):
                  raise ValueError("archive member set differs from the packaging contract")

              def check_member(name, size, mode, handle):
                  record = by_name[name]
                  if size != record["size_bytes"] or mode != int(record["mode"], 8):
                      raise ValueError("archive member size or mode mismatch")
                  digest, actual_size = hash_stream(handle)
                  if digest != record["sha256"] or actual_size != record["size_bytes"]:
                      raise ValueError("archive member content hash mismatch")

              # Read bounded members; never extract paths, execute binaries or import code.
              if archive["format"] == "zip":
                  date_time = time.gmtime(max(source_date_epoch, 315_532_800))[:6]
                  date_time = date_time[:5] + (date_time[5] // 2 * 2,)
                  with zipfile.ZipFile(path) as packed:
                      members = packed.infolist()
                      if len(members) != len(by_name) or {m.filename for m in members} != set(by_name):
                          raise ValueError("zip member inventory is not exact")
                      for member in members:
                          if member.date_time != date_time:
                              raise ValueError("zip member timestamp differs from the source date epoch")
                          kind = (member.external_attr >> 16) & 0o170000
                          if member.is_dir() or kind not in {0, 0o100000}:
                              raise ValueError("zip links and non-regular members are forbidden")
                          with packed.open(member) as handle:
                              check_member(member.filename, member.file_size, (member.external_attr >> 16) & 0o7777, handle)
              else:
                  with Path(path).open("rb") as raw:
                      header = raw.read(10)
                  if (len(header) != 10 or header[:3] != b"\x1f\x8b\x08"
                          or int.from_bytes(header[4:8], "little") != source_date_epoch):
                      raise ValueError("gzip header timestamp differs from the source date epoch")
                  with tarfile.open(path, mode="r:gz") as packed:
                      members = packed.getmembers()
                      if len(members) != len(by_name) or {m.name for m in members} != set(by_name):
                          raise ValueError("tar member inventory is not exact")
                      for member in members:
                          if member.mtime != source_date_epoch:
                              raise ValueError("tar member timestamp differs from the source date epoch")
                          if not member.isfile() or member.issparse():
                              raise ValueError("tar links and non-regular members are forbidden")
                          with packed.extractfile(member) as handle:
                              check_member(member.name, member.size, member.mode, handle)

          def validate_artifacts(root, tag, version, source_commit, source_date_epoch, cargo_lock_sha256):
              root = Path(root)
              if validate_tag(tag) != "v" + validate_version(version):
                  raise ValueError("bundle tag and version mismatch")
              validate_source_commit(source_commit)
              if type(source_date_epoch) is not int or source_date_epoch < 0:
                  raise ValueError("invalid bundle source date epoch")
              if not isinstance(cargo_lock_sha256, str) or not re.fullmatch(r"[0-9a-f]{64}", cargo_lock_sha256):
                  raise ValueError("invalid prepared lockfile digest")
              expected = set(DEPENDENCIES)
              for target, (archive_format, _) in TARGETS.items():
                  base = f"agent-session-grep-{tag}-{target}"
                  expected.update({base + "." + archive_format, base + ".manifest.json"})
              validate_checksums(root, expected)
              dependency_report = json.loads((root / DEPENDENCIES[0]).read_text(encoding="utf-8"), object_pairs_hook=unique_object)
              if (not isinstance(dependency_report, dict)
                      or dependency_report.get("schema") != "agent-session-grep.third-party-dependencies/v1"
                      or dependency_report.get("release_version") != version or dependency_report.get("spdx_document") is not False
                      or not isinstance(dependency_report.get("dependencies"), list)
                      or type(dependency_report.get("dependency_count")) is not int
                      or dependency_report["dependency_count"] != len(dependency_report["dependencies"])):
                  raise ValueError("common dependency inventory contract mismatch")
              dependency_hashes = {name: sha256_file(root / name) for name in DEPENDENCIES}
              shared_hashes = None
              for target, (archive_format, binary) in TARGETS.items():
                  base = f"agent-session-grep-{tag}-{target}"
                  manifest = json.loads((root / (base + ".manifest.json")).read_text(encoding="utf-8"), object_pairs_hook=unique_object)
                  if (not isinstance(manifest, dict) or set(manifest) != {"schema", "release", "archive", "inputs", "provenance"}
                      or manifest.get("schema") != "agent-session-grep.release-archive-manifest/v1"):
                      raise ValueError("unsupported archive manifest schema")
                  release = manifest.get("release")
                  if (not isinstance(release, dict) or release != {"tag": tag, "version": version, "target": target,
                          "source_commit": source_commit, "source_date_epoch": source_date_epoch, "unsigned": True}
                          or release.get("unsigned") is not True or type(release.get("source_date_epoch")) is not int):
                      raise ValueError("archive release provenance mismatch")
                  inputs, provenance, archive = manifest.get("inputs"), manifest.get("provenance"), manifest.get("archive")
                  if (not isinstance(inputs, dict) or set(inputs) != {"cargo_lock_sha256", "dependency_inventory_schema"}
                          or inputs.get("cargo_lock_sha256") != cargo_lock_sha256
                          or inputs.get("dependency_inventory_schema") != "agent-session-grep.third-party-dependencies/v1"
                          or not isinstance(provenance, dict) or set(provenance) != {"kind", "cryptographic_attestation", "limitation"}
                          or provenance.get("kind") != "self-reported-build-metadata"
                          or provenance.get("cryptographic_attestation") is not False
                          or provenance.get("limitation") != "This manifest is unsigned metadata, not a signature, notarization, or GitHub Artifact Attestation."):
                      raise ValueError("archive input or unsigned provenance mismatch")
                  filename = base + "." + archive_format
                  if (not isinstance(archive, dict) or set(archive) != {"filename", "format", "root", "sha256", "size_bytes", "files"}
                          or archive.get("filename") != filename
                          or archive.get("format") != archive_format or archive.get("root") != base
                          or type(archive.get("size_bytes")) is not int or archive["size_bytes"] != (root / filename).stat().st_size
                          or archive.get("sha256") != sha256_file(root / filename)):
                      raise ValueError("archive metadata or digest mismatch")
                  validate_archive_members(root / filename, archive, binary, dependency_hashes, source_date_epoch)
                  document_hashes = {entry["name"].split("/")[-1]: entry["sha256"] for entry in archive["files"]
                                     if entry["name"].split("/")[-1] in DOCUMENTS}
                  if shared_hashes is not None and document_hashes != shared_hashes:
                      raise ValueError("release documents differ between target archives")
                  shared_hashes = document_hashes

          import os

          if __name__ == "__main__":
              validate_artifacts("dist", os.environ["RELEASE_TAG"], os.environ["VERSION"], os.environ["SOURCE_COMMIT"],
                                 int(os.environ["SOURCE_DATE_EPOCH"]), os.environ["CARGO_LOCK_SHA256"])

      - name: Upload complete temporary unsigned bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-session-grep-release-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: all required release checks
    if: always()
    needs: [prepare, quality, build, assemble]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every result and all four completed build jobs
        id: gate
        shell: python {0}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def api_get(path, allow_not_found=False):
              if not path.startswith("/repos/") or "#" in path:
                  raise ValueError("unexpected GitHub API path")
              request = urllib.request.Request(
                  os.environ["GITHUB_API_URL"].rstrip("/") + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError("unexpected GitHub API status")
                      data = json.loads(response.read(), object_pairs_hook=unique_object)
                      if not isinstance(data, (dict, list)):
                          raise ValueError("malformed GitHub API JSON root")
                      return data
              except urllib.error.HTTPError as error:
                  if allow_not_found and error.code == 404:
                      return None
                  raise ValueError(f"GitHub API returned HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError):
                  raise ValueError("GitHub API request failed") from None

          def require_success(needs, expected):
              if not expected or len(set(expected)) != len(expected):
                  raise ValueError("required job inventory is empty or duplicated")
              if not isinstance(needs, dict) or set(needs) != set(expected):
                  raise ValueError("required job result inventory is incomplete")
              for name in expected:
                  if not isinstance(needs[name], dict) or needs[name].get("result") != "success":
                      raise ValueError("required job did not succeed: " + name)

          def load_jobs(api, repo, run_id, run_attempt):
              result, seen, total = [], set(), None
              page = 1
              while total is None or len(result) < total:
                  data = api(f"/repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100&page={page}")
                  if not isinstance(data, dict) or type(data.get("total_count")) is not int or data["total_count"] < 0:
                      raise ValueError("invalid job pagination metadata")
                  if total is not None and total != data["total_count"]:
                      raise ValueError("job inventory changed while paginating")
                  total = data["total_count"]
                  batch = data.get("jobs")
                  if not isinstance(batch, list) or len(batch) > 100 or (not batch and len(result) != total):
                      raise ValueError("incomplete job pagination")
                  for job in batch:
                      if not isinstance(job, dict) or type(job.get("id")) is not int or job["id"] <= 0 or job["id"] in seen:
                          raise ValueError("invalid or duplicate job record")
                      seen.add(job["id"])
                  result.extend(batch)
                  if len(result) > total:
                      raise ValueError("job count exceeds declared total")
                  page += 1
              return result

          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          def expected_api_head(event_name, event, caller_sha):
              caller_sha = validate_source_commit(caller_sha)
              if not isinstance(event, dict):
                  raise ValueError("caller event must be an object")
              if event_name == "pull_request":
                  pull_request = event.get("pull_request")
                  if not isinstance(pull_request, dict) or not isinstance(pull_request.get("head"), dict):
                      raise ValueError("PR event is missing its head identity")
                  # The API describes the PR branch head H, while checkout/test uses the
                  # event's synthetic merge commit M. Neither is a fallback for the other.
                  return validate_source_commit(pull_request["head"].get("sha"))
              if event_name not in {"push", "workflow_dispatch", "schedule"}:
                  raise ValueError("unsupported caller event for API job identity")
              return caller_sha

          def required_step_names(name):
              source = ["Checkout exact source", "Assert exact source checkout"]
              if name == "validate exact CI source":
                  return ["Validate required source SHA"]
              if name == "resolve audit source":
                  return ["Resolve exact audit source"]
              if name == "all required quality checks":
                  return ["Require every quality result and matrix member"]
              if name.startswith("test ("):
                  return source + ["Install Rust toolchain", "Install Python", "Cache cargo registry and target",
                      "Format check", "Clippy", "Test", "Web client interaction tests", "Test semantic-candle feature",
                      "Check semantic-candle entrypoints", "Robot contract tests", "Release verifier and entry-point tests",
                      "Release manifest tests", "Evidence harness tests"]
              if name.startswith("installer smoke ("):
                  platform = "windows" if name == "installer smoke (windows-latest)" else "unix"
                  return source + ["Install Rust toolchain", "Install Python", "Cache cargo registry and target", "Build release binary",
                      f"Install into a workspace-local prefix ({platform})", f"Invoke both installed commands ({platform})",
                      f"Surface smoke ({platform})", f"Uninstall twice ({platform})", "Regression harness self-test"]
              if name == "Cargo dependency audit":
                  return source + ["Install pinned audit tools", "Verify committed lockfile", "Check dependency policy",
                                   "Check zero-egress static audit", "Check RustSec advisories"]
              if name.startswith(("build ", "verify ")):
                  return source + ["Install Python", "Install Rust toolchain", "Download common release inputs", "Build locked release binary",
                                  "Verify exact binary version", "Synthetic release smoke", "Build deterministic unsigned archive and manifest",
                                  "Write target artifact checksums", "Upload unsigned target artifact"]
              if name == "resolve exact source and release inputs":
                  return ["Resolve exact prepared source", *source, "Install Python", "Install Rust toolchain",
                          "Validate workspace version and immutable inputs", "Generate locked metadata and dependency inventory",
                          "Upload common release inputs"]
              if name == "validate complete four-target unsigned bundle":
                  return source + ["Install Python", "Download separate target artifacts without merging", "Download common dependency inventory",
                                  "Validate target inventories before assembling", "Write complete bundle checksums with the existing helper",
                                  "Verify all bundle bytes and unsigned provenance", "Upload complete temporary unsigned bundle"]
              raise ValueError("unknown required job step contract")

          def require_steps(job, expected):
              steps = job.get("steps")
              if not isinstance(steps, list) or not expected or len(set(expected)) != len(expected):
                  raise ValueError("required step inventory is missing or invalid")
              numbers, found = set(), {name: [] for name in expected}
              for step in steps:
                  if (not isinstance(step, dict) or not isinstance(step.get("name"), str)
                          or type(step.get("number")) is not int or step["number"] <= 0 or step["number"] in numbers):
                      raise ValueError("malformed or duplicate step record")
                  numbers.add(step["number"])
                  if step["name"] in found:
                      found[step["name"]].append(step)
              for name, matches in found.items():
                  if len(matches) != 1 or matches[0].get("status") != "completed" or matches[0].get("conclusion") != "success":
                      raise ValueError("required command step is missing, duplicated or non-success: " + name)

          def require_jobs(jobs, expected, run_id, run_attempt, caller_sha):
              import re
              if (not isinstance(caller_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", caller_sha)
                      or caller_sha == "0" * 40 or type(run_id) is not int or run_id <= 0
                      or type(run_attempt) is not int or run_attempt <= 0):
                  raise ValueError("invalid caller run identity")
              if not isinstance(jobs, list) or not expected or len(set(expected)) != len(expected):
                  raise ValueError("invalid required matrix inventory")
              found = {name: [] for name in expected}
              seen = set()
              for job in jobs:
                  if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                      raise ValueError("malformed workflow job")
                  if type(job.get("id")) is not int or job["id"] <= 0 or job["id"] in seen:
                      raise ValueError("invalid or duplicate workflow job ID")
                  seen.add(job["id"])
                  leaf = job["name"].split(" / ")[-1]
                  if leaf in found:
                      prefixes = [""]
                      if leaf.startswith(("test (", "installer smoke (")) or leaf in {"validate exact CI source", "all required quality checks"}:
                          prefixes.append("required CI quality gates / ")
                      elif leaf in {"Cargo dependency audit", "resolve audit source"}:
                          prefixes.extend(["required security audit / ",
                                           "required CI quality gates / required security audit / "])
                      if job["name"] not in {prefix + leaf for prefix in prefixes}:
                          raise ValueError("unexpected reusable job name prefix")
                      found[leaf].append(job)
              for name, matches in found.items():
                  if len(matches) != 1:
                      raise ValueError("required matrix job missing or duplicated: " + name)
                  job = matches[0]
                  if (type(job.get("run_id")) is not int or job["run_id"] != run_id
                          or type(job.get("run_attempt")) is not int or job["run_attempt"] != run_attempt
                          or job.get("head_sha") != caller_sha
                          or job.get("status") != "completed" or job.get("conclusion") != "success"):
                      raise ValueError("required matrix job is stale or non-success: " + name)
                  require_steps(job, required_step_names(name))


          if __name__ == "__main__":
              require_success(json.loads(os.environ["NEEDS_JSON"]), ["prepare", "quality", "build", "assemble"])
              run_id, attempt = int(os.environ["GITHUB_RUN_ID"]), int(os.environ["GITHUB_RUN_ATTEMPT"])
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file, object_pairs_hook=unique_object)
              api_head = expected_api_head(os.environ["EVENT_NAME"], event, os.environ["GITHUB_SHA"])
              expected = ["build " + target for target in (
                  "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin")]
              expected.extend(["resolve exact source and release inputs", "validate complete four-target unsigned bundle",
                               "all required quality checks"])
              require_jobs(load_jobs(api_get, os.environ["GITHUB_REPOSITORY"], run_id, attempt), expected, run_id, attempt,
                           api_head)


  publish:
    name: publish a new unsigned GitHub Release only
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, quality, build, assemble, gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.repository }}-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download the validated complete bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-session-grep-release-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-unsigned
          path: dist

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Inline reviewed control code is intentional here: this write-token job
      # never checks out, imports or executes candidate product code. Artifacts
      # are parsed as data and every byte is revalidated before any write.
      - name: Reject moved tags and existing Releases before publication
        id: publish
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          CARGO_LOCK_SHA256: ${{ needs.prepare.outputs.cargo_lock_sha256 }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          def validate_version(value):
              if not isinstance(value, str) or not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
                  r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", value
              ):
                  raise ValueError("version must be a canonical SemVer archive component")
              prerelease = value.split("+", 1)[0].partition("-")[2]
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise ValueError("numeric prerelease identifiers cannot have leading zeroes")
              return value

          def validate_tag(tag):
              if not isinstance(tag, str) or not tag.startswith("v"):
                  raise ValueError("release tag must be v<version>")
              validate_version(tag[1:])
              return tag

          import hashlib

          import json

          from pathlib import Path

          TARGETS = {
              "x86_64-pc-windows-msvc": ("zip", "agent-session-grep.exe"),
              "x86_64-unknown-linux-gnu": ("tar.gz", "agent-session-grep"),
              "x86_64-apple-darwin": ("tar.gz", "agent-session-grep"),
              "aarch64-apple-darwin": ("tar.gz", "agent-session-grep"),
          }

          DEPENDENCIES = ("THIRD-PARTY-DEPENDENCIES.json", "THIRD-PARTY-DEPENDENCIES.csv")

          DOCUMENTS = ("README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def hash_stream(handle):
              digest, size = hashlib.sha256(), 0
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
                  size += len(chunk)
              return digest.hexdigest(), size

          def sha256_file(path):
              with Path(path).open("rb") as handle:
                  return hash_stream(handle)[0]

          def require_files(root, expected):
              root = Path(root)
              if root.is_symlink() or not root.is_dir():
                  raise ValueError("artifact directory is missing or linked")
              files = list(root.iterdir())
              if {path.name for path in files} != set(expected) or any(path.is_symlink() or not path.is_file() for path in files):
                  raise ValueError("artifact file inventory does not exactly match the contract")

          def validate_checksums(root, expected):
              root = Path(root)
              require_files(root, {*expected, "SHA256SUMS"})
              found = set()
              for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  if not match or match[2] not in expected or match[2] in found:
                      raise ValueError("malformed, duplicate or unexpected checksum entry")
                  found.add(match[2])
                  if sha256_file(root / match[2]) != match[1]:
                      raise ValueError("artifact checksum mismatch")
              if found != set(expected):
                  raise ValueError("checksum inventory is incomplete")

          import tarfile
          import time

          import zipfile

          def validate_archive_members(path, archive, binary, dependency_hashes, source_date_epoch):
              root = archive["root"]
              modes = {root + "/" + name: "0644" for name in (*DOCUMENTS, *DEPENDENCIES)}
              modes[root + "/" + binary] = "0755"
              records = archive.get("files")
              if not isinstance(records, list) or len(records) != len(modes):
                  raise ValueError("archive member manifest is incomplete")
              by_name = {}
              for record in records:
                  if not isinstance(record, dict) or set(record) != {"name", "mode", "size_bytes", "sha256"}:
                      raise ValueError("malformed archive member manifest")
                  name = record["name"]
                  if not isinstance(name, str) or name not in modes or name in by_name:
                      raise ValueError("unexpected or duplicate archive member path")
                  if (record["mode"] != modes[name] or type(record["size_bytes"]) is not int or record["size_bytes"] < 0
                          or not isinstance(record["sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", record["sha256"])):
                      raise ValueError("invalid archive member metadata")
                  leaf = name.split("/")[-1]
                  if leaf in dependency_hashes and record["sha256"] != dependency_hashes[leaf]:
                      raise ValueError("archive dependency inventory does not match the common inputs")
                  by_name[name] = record
              if set(by_name) != set(modes):
                  raise ValueError("archive member set differs from the packaging contract")

              def check_member(name, size, mode, handle):
                  record = by_name[name]
                  if size != record["size_bytes"] or mode != int(record["mode"], 8):
                      raise ValueError("archive member size or mode mismatch")
                  digest, actual_size = hash_stream(handle)
                  if digest != record["sha256"] or actual_size != record["size_bytes"]:
                      raise ValueError("archive member content hash mismatch")

              # Read bounded members; never extract paths, execute binaries or import code.
              if archive["format"] == "zip":
                  date_time = time.gmtime(max(source_date_epoch, 315_532_800))[:6]
                  date_time = date_time[:5] + (date_time[5] // 2 * 2,)
                  with zipfile.ZipFile(path) as packed:
                      members = packed.infolist()
                      if len(members) != len(by_name) or {m.filename for m in members} != set(by_name):
                          raise ValueError("zip member inventory is not exact")
                      for member in members:
                          if member.date_time != date_time:
                              raise ValueError("zip member timestamp differs from the source date epoch")
                          kind = (member.external_attr >> 16) & 0o170000
                          if member.is_dir() or kind not in {0, 0o100000}:
                              raise ValueError("zip links and non-regular members are forbidden")
                          with packed.open(member) as handle:
                              check_member(member.filename, member.file_size, (member.external_attr >> 16) & 0o7777, handle)
              else:
                  with Path(path).open("rb") as raw:
                      header = raw.read(10)
                  if (len(header) != 10 or header[:3] != b"\x1f\x8b\x08"
                          or int.from_bytes(header[4:8], "little") != source_date_epoch):
                      raise ValueError("gzip header timestamp differs from the source date epoch")
                  with tarfile.open(path, mode="r:gz") as packed:
                      members = packed.getmembers()
                      if len(members) != len(by_name) or {m.name for m in members} != set(by_name):
                          raise ValueError("tar member inventory is not exact")
                      for member in members:
                          if member.mtime != source_date_epoch:
                              raise ValueError("tar member timestamp differs from the source date epoch")
                          if not member.isfile() or member.issparse():
                              raise ValueError("tar links and non-regular members are forbidden")
                          with packed.extractfile(member) as handle:
                              check_member(member.name, member.size, member.mode, handle)

          def validate_artifacts(root, tag, version, source_commit, source_date_epoch, cargo_lock_sha256):
              root = Path(root)
              if validate_tag(tag) != "v" + validate_version(version):
                  raise ValueError("bundle tag and version mismatch")
              validate_source_commit(source_commit)
              if type(source_date_epoch) is not int or source_date_epoch < 0:
                  raise ValueError("invalid bundle source date epoch")
              if not isinstance(cargo_lock_sha256, str) or not re.fullmatch(r"[0-9a-f]{64}", cargo_lock_sha256):
                  raise ValueError("invalid prepared lockfile digest")
              expected = set(DEPENDENCIES)
              for target, (archive_format, _) in TARGETS.items():
                  base = f"agent-session-grep-{tag}-{target}"
                  expected.update({base + "." + archive_format, base + ".manifest.json"})
              validate_checksums(root, expected)
              dependency_report = json.loads((root / DEPENDENCIES[0]).read_text(encoding="utf-8"), object_pairs_hook=unique_object)
              if (not isinstance(dependency_report, dict)
                      or dependency_report.get("schema") != "agent-session-grep.third-party-dependencies/v1"
                      or dependency_report.get("release_version") != version or dependency_report.get("spdx_document") is not False
                      or not isinstance(dependency_report.get("dependencies"), list)
                      or type(dependency_report.get("dependency_count")) is not int
                      or dependency_report["dependency_count"] != len(dependency_report["dependencies"])):
                  raise ValueError("common dependency inventory contract mismatch")
              dependency_hashes = {name: sha256_file(root / name) for name in DEPENDENCIES}
              shared_hashes = None
              for target, (archive_format, binary) in TARGETS.items():
                  base = f"agent-session-grep-{tag}-{target}"
                  manifest = json.loads((root / (base + ".manifest.json")).read_text(encoding="utf-8"), object_pairs_hook=unique_object)
                  if (not isinstance(manifest, dict) or set(manifest) != {"schema", "release", "archive", "inputs", "provenance"}
                      or manifest.get("schema") != "agent-session-grep.release-archive-manifest/v1"):
                      raise ValueError("unsupported archive manifest schema")
                  release = manifest.get("release")
                  if (not isinstance(release, dict) or release != {"tag": tag, "version": version, "target": target,
                          "source_commit": source_commit, "source_date_epoch": source_date_epoch, "unsigned": True}
                          or release.get("unsigned") is not True or type(release.get("source_date_epoch")) is not int):
                      raise ValueError("archive release provenance mismatch")
                  inputs, provenance, archive = manifest.get("inputs"), manifest.get("provenance"), manifest.get("archive")
                  if (not isinstance(inputs, dict) or set(inputs) != {"cargo_lock_sha256", "dependency_inventory_schema"}
                          or inputs.get("cargo_lock_sha256") != cargo_lock_sha256
                          or inputs.get("dependency_inventory_schema") != "agent-session-grep.third-party-dependencies/v1"
                          or not isinstance(provenance, dict) or set(provenance) != {"kind", "cryptographic_attestation", "limitation"}
                          or provenance.get("kind") != "self-reported-build-metadata"
                          or provenance.get("cryptographic_attestation") is not False
                          or provenance.get("limitation") != "This manifest is unsigned metadata, not a signature, notarization, or GitHub Artifact Attestation."):
                      raise ValueError("archive input or unsigned provenance mismatch")
                  filename = base + "." + archive_format
                  if (not isinstance(archive, dict) or set(archive) != {"filename", "format", "root", "sha256", "size_bytes", "files"}
                          or archive.get("filename") != filename
                          or archive.get("format") != archive_format or archive.get("root") != base
                          or type(archive.get("size_bytes")) is not int or archive["size_bytes"] != (root / filename).stat().st_size
                          or archive.get("sha256") != sha256_file(root / filename)):
                      raise ValueError("archive metadata or digest mismatch")
                  validate_archive_members(root / filename, archive, binary, dependency_hashes, source_date_epoch)
                  document_hashes = {entry["name"].split("/")[-1]: entry["sha256"] for entry in archive["files"]
                                     if entry["name"].split("/")[-1] in DOCUMENTS}
                  if shared_hashes is not None and document_hashes != shared_hashes:
                      raise ValueError("release documents differ between target archives")
                  shared_hashes = document_hashes

          import os

          import urllib.error

          import urllib.parse

          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def api_get(path, allow_not_found=False):
              if not path.startswith("/repos/") or "#" in path:
                  raise ValueError("unexpected GitHub API path")
              request = urllib.request.Request(
                  os.environ["GITHUB_API_URL"].rstrip("/") + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError("unexpected GitHub API status")
                      data = json.loads(response.read(), object_pairs_hook=unique_object)
                      if not isinstance(data, (dict, list)):
                          raise ValueError("malformed GitHub API JSON root")
                      return data
              except urllib.error.HTTPError as error:
                  if allow_not_found and error.code == 404:
                      return None
                  raise ValueError(f"GitHub API returned HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError):
                  raise ValueError("GitHub API request failed") from None

          def select_tag(event_name, ref, inputs):
              # Push has no inputs context: do not inspect it or let it select a tag.
              if event_name == "push":
                  if not isinstance(ref, str) or not ref.startswith("refs/tags/"):
                      raise ValueError("publication requires a tag push")
                  return validate_tag(ref[len("refs/tags/"):])
              if event_name != "workflow_dispatch":
                  raise ValueError("unsupported release event")
              if not isinstance(inputs, dict) or set(inputs) != {"tag"}:
                  raise ValueError("manual release rehearsal requires exactly one existing tag input")
              return validate_tag(inputs["tag"])

          def resolve_tag(api, repo, tag):
              validate_tag(tag)
              if not isinstance(repo, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise ValueError("invalid repository identity")
              data = api(f"/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
              if not isinstance(data, dict) or data.get("ref") != "refs/tags/" + tag:
                  raise ValueError("exact tag ref is missing or mismatched")
              obj = data.get("object")
              if not isinstance(obj, dict):
                  raise ValueError("tag ref has no object")
              tag_object = validate_source_commit(obj.get("sha"))
              seen = set()
              while obj.get("type") == "tag":
                  sha = validate_source_commit(obj.get("sha"))
                  if sha in seen or len(seen) >= 32:
                      raise ValueError("cyclic or unsupported tag chain")
                  seen.add(sha)
                  data = api(f"/repos/{repo}/git/tags/{sha}")
                  if not isinstance(data, dict) or data.get("sha") != sha or not isinstance(data.get("object"), dict):
                      raise ValueError("annotated tag object is missing or mismatched")
                  obj = data["object"]
              if obj.get("type") != "commit":
                  raise ValueError("release tag must resolve to a commit")
              return {"tag_object": tag_object, "source_commit": validate_source_commit(obj.get("sha"))}

          def require_tag_identity(resolved, tag_object, source_commit):
              expected = {"tag_object": validate_source_commit(tag_object),
                          "source_commit": validate_source_commit(source_commit)}
              if resolved != expected:
                  raise ValueError("release tag moved after preparation")

          def require_success(needs, expected):
              if not expected or len(set(expected)) != len(expected):
                  raise ValueError("required job inventory is empty or duplicated")
              if not isinstance(needs, dict) or set(needs) != set(expected):
                  raise ValueError("required job result inventory is incomplete")
              for name in expected:
                  if not isinstance(needs[name], dict) or needs[name].get("result") != "success":
                      raise ValueError("required job did not succeed: " + name)

          import subprocess

          def require_absent_release(api, repo, tag):
              validate_tag(tag)
              info = api(f"/repos/{repo}")
              # A private repository can mask an authentication failure as 404. Prove
              # repository identity and push visibility before treating tag 404 as absence.
              if (not isinstance(info, dict) or info.get("full_name") != repo
                      or type(info.get("id")) is not int or info["id"] <= 0
                      or not isinstance(info.get("permissions"), dict) or info["permissions"].get("push") is not True):
                  raise ValueError("repository identity or draft-release visibility is not proven")
              endpoint = f"/repos/{repo}/releases/tags/{urllib.parse.quote(tag, safe='')}"
              if api(endpoint, allow_not_found=True) is not None:
                  raise ValueError("an existing Release or assets must never be replaced")
              page, seen, asset_ids = 1, set(), set()
              while True:
                  releases = api(f"/repos/{repo}/releases?per_page=100&page={page}")
                  if not isinstance(releases, list) or len(releases) > 100:
                      raise ValueError("malformed release inventory page")
                  # Request the next page even after a short nonempty page. Only a
                  # confirmed empty terminal page ends enumeration; errors never do.
                  if not releases:
                      break
                  for release in releases:
                      if (not isinstance(release, dict) or type(release.get("id")) is not int
                              or release["id"] <= 0 or release["id"] in seen
                              or not isinstance(release.get("tag_name"), str) or not release["tag_name"]
                              or type(release.get("draft")) is not bool or not isinstance(release.get("assets"), list)):
                          raise ValueError("malformed or duplicate release inventory record")
                      seen.add(release["id"])
                      if release["tag_name"] == tag:
                          raise ValueError("an existing published or draft Release must never be replaced")
                      for asset in release["assets"]:
                          if (not isinstance(asset, dict) or type(asset.get("id")) is not int
                                  or asset["id"] <= 0 or asset["id"] in asset_ids
                                  or not isinstance(asset.get("name"), str) or not asset["name"]):
                              raise ValueError("malformed or duplicate existing asset record")
                          asset_ids.add(asset["id"])
                  page += 1
              if api(endpoint, allow_not_found=True) is not None:
                  raise ValueError("a Release appeared during the publication preflight")

          if __name__ == "__main__":
              require_success(json.loads(os.environ["NEEDS_JSON"]), ["prepare", "quality", "build", "assemble", "gate"])
              tag, version, source = os.environ["RELEASE_TAG"], os.environ["VERSION"], os.environ["SOURCE_COMMIT"]
              validate_artifacts("dist", tag, version, source, int(os.environ["SOURCE_DATE_EPOCH"]), os.environ["CARGO_LOCK_SHA256"])
              repo = os.environ["GH_REPO"]
              identity = api_get(f"/repos/{repo}")
              if not isinstance(identity, dict) or str(identity.get("id")) != os.environ["REPOSITORY_ID"]:
                  raise ValueError("publication repository identity changed")
              require_absent_release(api_get, repo, tag)
              # Compare the ref object as well as its peeled commit: re-annotating a tag
              # to the same commit is still movement, not permission to publish it.
              require_tag_identity(resolve_tag(api_get, repo, tag), os.environ["TAG_OBJECT"], source)
              assets = [str(path) for path in sorted(Path("dist").iterdir())]
              try:
                  subprocess.run([
                      "gh", "release", "create", tag, *assets, "--verify-tag", "--repo", repo,
                      "--title", "agent-session-grep " + tag,
                      "--notes", "Unsigned release archives with SHA-256 checksums, dependency inventory, and self-reported provenance manifests. Signing, notarization, and cryptographic attestation are external release gates.",
                  ], check=True)
              except subprocess.CalledProcessError:
                  raise RuntimeError("Release publication failed; a new partial draft may remain. Stop for owner review; no update, replacement or cleanup was attempted.") from None
