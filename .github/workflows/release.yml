name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<version> tag to rehearse without publishing"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  quality:
    name: required CI quality gates
    needs: [prepare]
    uses: ./.github/workflows/ci.yml
    with:
      source_commit: ${{ needs.prepare.outputs.source_commit }}

  prepare:
    name: resolve exact source and release inputs
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      cargo_lock_sha256: ${{ steps.version.outputs.cargo_lock_sha256 }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - name: Resolve exact prepared source
        id: release
        shell: python {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value


          def validate_version(value):
              if not isinstance(value, str) or not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
                  r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", value
              ):
                  raise ValueError("version must be a canonical SemVer archive component")
              prerelease = value.split("+", 1)[0].partition("-")[2]
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise ValueError("numeric prerelease identifiers cannot have leading zeroes")
              return value

          def validate_tag(tag):
              if not isinstance(tag, str) or not tag.startswith("v"):
                  raise ValueError("release tag must be v<version>")
              validate_version(tag[1:])
              return tag
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def api_get(path, allow_not_found=False):
              if not path.startswith("/repos/") or "#" in path:
                  raise ValueError("unexpected GitHub API path")
              request = urllib.request.Request(
                  os.environ["GITHUB_API_URL"].rstrip("/") + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError("unexpected GitHub API status")
                      data = json.loads(response.read(), object_pairs_hook=unique_object)
                      if not isinstance(data, (dict, list)):
                          raise ValueError("malformed GitHub API JSON root")
                      return data
              except urllib.error.HTTPError as error:
                  if allow_not_found and error.code == 404:
                      return None
                  raise ValueError(f"GitHub API returned HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError):
                  raise ValueError("GitHub API request failed") from None


          def select_tag(event_name, ref, inputs):
              # Push has no inputs context: do not inspect it or let it select a tag.
              if event_name == "push":
                  if not isinstance(ref, str) or not ref.startswith("refs/tags/"):
                      raise ValueError("publication requires a tag push")
                  return validate_tag(ref[len("refs/tags/"):])
              if event_name != "workflow_dispatch":
                  raise ValueError("unsupported release event")
              if not isinstance(inputs, dict) or set(inputs) != {"tag"}:
                  raise ValueError("manual release rehearsal requires exactly one existing tag input")
              return validate_tag(inputs["tag"])

          def resolve_tag(api, repo, tag):
              validate_tag(tag)
              if not isinstance(repo, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise ValueError("invalid repository identity")
              data = api(f"/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
              if not isinstance(data, dict) or data.get("ref") != "refs/tags/" + tag:
                  raise ValueError("exact tag ref is missing or mismatched")
              obj = data.get("object")
              if not isinstance(obj, dict):
                  raise ValueError("tag ref has no object")
              tag_object = validate_source_commit(obj.get("sha"))
              seen = set()
              while obj.get("type") == "tag":
                  sha = validate_source_commit(obj.get("sha"))
                  if sha in seen or len(seen) >= 32:
                      raise ValueError("cyclic or unsupported tag chain")
                  seen.add(sha)
                  data = api(f"/repos/{repo}/git/tags/{sha}")
                  if not isinstance(data, dict) or data.get("sha") != sha or not isinstance(data.get("object"), dict):
                      raise ValueError("annotated tag object is missing or mismatched")
                  obj = data["object"]
              if obj.get("type") != "commit":
                  raise ValueError("release tag must resolve to a commit")
              return {"tag_object": tag_object, "source_commit": validate_source_commit(obj.get("sha"))}

          def require_tag_identity(resolved, tag_object, source_commit):
              expected = {"tag_object": validate_source_commit(tag_object),
                          "source_commit": validate_source_commit(source_commit)}
              if resolved != expected:
                  raise ValueError("release tag moved after preparation")

          if __name__ == "__main__":
              event_name = os.environ["EVENT_NAME"]
              # Only a manual dispatch has input data to parse. A tag push is
              # selected from its ref even if the unavailable context is empty.
              inputs = json.loads(os.environ["INPUTS_JSON"], object_pairs_hook=unique_object) if event_name == "workflow_dispatch" else None
              tag = select_tag(event_name, os.environ["EVENT_REF"], inputs)
              resolved = resolve_tag(api_get, os.environ["GITHUB_REPOSITORY"], tag)
              if os.environ["EVENT_NAME"] == "push" and resolved["source_commit"] != validate_source_commit(os.environ["CALLER_SHA"]):
                  raise ValueError("tag push commit no longer matches the existing tag")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in {"tag": tag, **resolved}.items():
                      output.write(f"{key}={value}\n")

      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Keep settings action-local. The assertion below restores only the eight
        # release inputs from raw Git blobs, independent of checkout EOL handling.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ steps.release.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source checkout
        id: assert_source
        shell: python {0}
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os
          import subprocess
          import stat
          from pathlib import Path

          def assert_source(source_commit):
              expected = validate_source_commit(source_commit)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise ValueError("checkout HEAD does not match prepared source_commit")

          RELEASE_INPUTS = ("Cargo.lock", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE",
                            "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def materialize_release_inputs(source_commit):
              source = validate_source_commit(source_commit)
              tree = subprocess.check_output(["git", "ls-tree", "-z", "--full-tree", source, "--", *RELEASE_INPUTS])
              if not tree.endswith(b"\0"):
                  raise ValueError("required release input tree is missing or incomplete")
              names = {name.encode("ascii"): name for name in RELEASE_INPUTS}
              objects = {}
              for record in tree[:-1].split(b"\0"):
                  header, separator, filename = record.partition(b"\t")
                  fields = header.split()
                  if (not separator or len(fields) != 3 or fields[0] not in {b"100644", b"100755"}
                          or fields[1] != b"blob" or not re.fullmatch(rb"[0-9a-f]{40}", fields[2])
                          or filename not in names or names[filename] in objects):
                      raise ValueError("release inputs must be unique regular Git blobs")
                  objects[names[filename]] = fields[2].decode("ascii")
              if set(objects) != set(RELEASE_INPUTS):
                  raise ValueError("required release input inventory is incomplete")
              prepared = []
              for name in RELEASE_INPUTS:
                  path = Path(name)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise ValueError("release input is not a singly linked regular working file")
                  content = subprocess.check_output(["git", "cat-file", "blob", objects[name]])
                  prepared.append((path, info, content))
              # Validate the complete inventory and read all immutable blobs before
              # any write. Never normalize other files, create a missing input or
              # run smudge/textconv filters while materializing these eight paths.
              for path, info, content in prepared:
                  with path.open("r+b") as handle:
                      current = os.fstat(handle.fileno())
                      if (not stat.S_ISREG(current.st_mode) or current.st_nlink != 1
                              or (current.st_dev, current.st_ino) != (info.st_dev, info.st_ino)):
                          raise ValueError("release input identity changed before materialization")
                      if handle.read() != content:
                          handle.seek(0)
                          handle.write(content)
                          handle.truncate()

          if __name__ == "__main__":
              assert_source(os.environ["SOURCE_COMMIT"])
              materialize_release_inputs(os.environ["SOURCE_COMMIT"])

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Validate workspace version and immutable inputs
        id: version
        shell: python {0}
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          REQUESTED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value


          def validate_version(value):
              if not isinstance(value, str) or not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
                  r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", value
              ):
                  raise ValueError("version must be a canonical SemVer archive component")
              prerelease = value.split("+", 1)[0].partition("-")[2]
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise ValueError("numeric prerelease identifiers cannot have leading zeroes")
              return value

          def validate_tag(tag):
              if not isinstance(tag, str) or not tag.startswith("v"):
                  raise ValueError("release tag must be v<version>")
              validate_version(tag[1:])
              return tag

          import hashlib
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          if __name__ == "__main__":
              source_commit = validate_source_commit(os.environ["SOURCE_COMMIT"])
              with Path("Cargo.toml").open("rb") as manifest:
                  version = validate_version(tomllib.load(manifest)["workspace"]["package"]["version"])
              tag = "v" + version
              requested = os.environ["REQUESTED_TAG"]
              if requested and validate_tag(requested) != tag:
                  raise ValueError("tag and workspace version disagree")
              epoch = subprocess.check_output(["git", "show", "-s", "--format=%ct", source_commit], text=True).strip()
              if not re.fullmatch(r"0|[1-9][0-9]*", epoch):
                  raise ValueError("invalid source date epoch")
              lock_hash = hashlib.sha256(Path("Cargo.lock").read_bytes()).hexdigest()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in {"tag": tag, "version": version, "source_date_epoch": epoch,
                                     "cargo_lock_sha256": lock_hash}.items():
                      output.write(f"{key}={value}\n")

      - name: Generate locked metadata and dependency inventory
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path 'release-inputs' | Out-Null
          cargo metadata --locked --format-version 1 |
            Set-Content -Encoding utf8NoBOM -Path 'release-inputs/cargo-metadata.json'
          python scripts/release/build-manifest.py validate `
            --workspace . --tag $env:RELEASE_TAG --version $env:VERSION `
            --metadata 'release-inputs/cargo-metadata.json'
          python scripts/release/build-manifest.py inventory `
            --workspace . --metadata 'release-inputs/cargo-metadata.json' `
            --version $env:VERSION --output-dir 'release-inputs'
          Remove-Item -LiteralPath 'release-inputs/cargo-metadata.json'
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Upload common release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs-${{ steps.release.outputs.source_commit }}-${{ github.run_attempt }}
          path: |
            release-inputs/THIRD-PARTY-DEPENDENCIES.json
            release-inputs/THIRD-PARTY-DEPENDENCIES.csv
          if-no-files-found: error
          retention-days: 30

  build:
    name: build ${{ matrix.target }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: agent-session-grep.exe
            archive_format: zip
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: agent-session-grep
            archive_format: tar.gz
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: agent-session-grep
            archive_format: tar.gz
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: agent-session-grep
            archive_format: tar.gz
            rustflags: ""
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      ARCHIVE_FORMAT: ${{ matrix.archive_format }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Keep settings action-local. The assertion below restores only the eight
        # release inputs from raw Git blobs, independent of checkout EOL handling.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source checkout
        id: assert_source
        shell: python {0}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os
          import subprocess
          import stat
          from pathlib import Path

          def assert_source(source_commit):
              expected = validate_source_commit(source_commit)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise ValueError("checkout HEAD does not match prepared source_commit")

          RELEASE_INPUTS = ("Cargo.lock", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE",
                            "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def materialize_release_inputs(source_commit):
              source = validate_source_commit(source_commit)
              tree = subprocess.check_output(["git", "ls-tree", "-z", "--full-tree", source, "--", *RELEASE_INPUTS])
              if not tree.endswith(b"\0"):
                  raise ValueError("required release input tree is missing or incomplete")
              names = {name.encode("ascii"): name for name in RELEASE_INPUTS}
              objects = {}
              for record in tree[:-1].split(b"\0"):
                  header, separator, filename = record.partition(b"\t")
                  fields = header.split()
                  if (not separator or len(fields) != 3 or fields[0] not in {b"100644", b"100755"}
                          or fields[1] != b"blob" or not re.fullmatch(rb"[0-9a-f]{40}", fields[2])
                          or filename not in names or names[filename] in objects):
                      raise ValueError("release inputs must be unique regular Git blobs")
                  objects[names[filename]] = fields[2].decode("ascii")
              if set(objects) != set(RELEASE_INPUTS):
                  raise ValueError("required release input inventory is incomplete")
              prepared = []
              for name in RELEASE_INPUTS:
                  path = Path(name)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise ValueError("release input is not a singly linked regular working file")
                  content = subprocess.check_output(["git", "cat-file", "blob", objects[name]])
                  prepared.append((path, info, content))
              # Validate the complete inventory and read all immutable blobs before
              # any write. Never normalize other files, create a missing input or
              # run smudge/textconv filters while materializing these eight paths.
              for path, info, content in prepared:
                  with path.open("r+b") as handle:
                      current = os.fstat(handle.fileno())
                      if (not stat.S_ISREG(current.st_mode) or current.st_nlink != 1
                              or (current.st_dev, current.st_ino) != (info.st_dev, info.st_ino)):
                          raise ValueError("release input identity changed before materialization")
                      if handle.read() != content:
                          handle.seek(0)
                          handle.write(content)
                          handle.truncate()

          if __name__ == "__main__":
              assert_source(os.environ["SOURCE_COMMIT"])
              materialize_release_inputs(os.environ["SOURCE_COMMIT"])

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Download common release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-inputs-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: release-inputs

      - name: Build locked release binary
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --no-default-features --target $env:TARGET `
            -p agent-session-grep-cli --bin agent-session-grep
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Verify exact binary version
        id: verify_binary
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path

          def validate_binary_version(reported, version):
              expected = "agent-session-grep " + version
              if reported not in (expected, expected + "\n", expected + "\r\n"):
                  raise ValueError("binary version does not exactly match the prepared version")

          if __name__ == "__main__":
              binary = Path("target", os.environ["TARGET"], "release", os.environ["BINARY"]).resolve(strict=True)
              validate_binary_version(subprocess.check_output([str(binary), "--version"], text=True), os.environ["VERSION"])

      - name: Synthetic release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path -LiteralPath "target/$env:TARGET/release/$env:BINARY").Path
          python scripts/verify-release.py --asg $binary

      - name: Build deterministic unsigned archive and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path -LiteralPath "target/$env:TARGET/release/$env:BINARY").Path
          # In release-verify the v<version> string is only an archive component;
          # packaging never creates a Git ref or a GitHub Release.
          python scripts/release/build-manifest.py package `
            --workspace . --binary $binary `
            --dependency-json 'release-inputs/THIRD-PARTY-DEPENDENCIES.json' `
            --dependency-csv 'release-inputs/THIRD-PARTY-DEPENDENCIES.csv' `
            --target $env:TARGET --tag $env:RELEASE_TAG --version $env:VERSION `
            --source-commit $env:SOURCE_COMMIT --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --archive-format $env:ARCHIVE_FORMAT --output-dir dist

      - name: Write target artifact checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release/build-manifest.py checksums `
            --directory dist --output dist/SHA256SUMS

      - name: Upload unsigned target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-target-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: validate complete four-target unsigned bundle
    needs: [prepare, quality, build]
    runs-on: ubuntu-22.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      CARGO_LOCK_SHA256: ${{ needs.prepare.outputs.cargo_lock_sha256 }}
      ARTIFACT_PREFIX: release-target-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Assert exact source checkout
        id: assert_source
        shell: python {0}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os
          import subprocess
          import stat
          from pathlib import Path

          def assert_source(source_commit):
              expected = validate_source_commit(source_commit)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise ValueError("checkout HEAD does not match prepared source_commit")

          RELEASE_INPUTS = ("Cargo.lock", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE",
                            "CHANGELOG.md", "SECURITY.md", "NOTICE")

          def materialize_release_inputs(source_commit):
              source = validate_source_commit(source_commit)
              tree = subprocess.check_output(["git", "ls-tree", "-z", "--full-tree", source, "--", *RELEASE_INPUTS])
              if not tree.endswith(b"\0"):
                  raise ValueError("required release input tree is missing or incomplete")
              names = {name.encode("ascii"): name for name in RELEASE_INPUTS}
              objects = {}
              for record in tree[:-1].split(b"\0"):
                  header, separator, filename = record.partition(b"\t")
                  fields = header.split()
                  if (not separator or len(fields) != 3 or fields[0] not in {b"100644", b"100755"}
                          or fields[1] != b"blob" or not re.fullmatch(rb"[0-9a-f]{40}", fields[2])
                          or filename not in names or names[filename] in objects):
                      raise ValueError("release inputs must be unique regular Git blobs")
                  objects[names[filename]] = fields[2].decode("ascii")
              if set(objects) != set(RELEASE_INPUTS):
                  raise ValueError("required release input inventory is incomplete")
              prepared = []
              for name in RELEASE_INPUTS:
                  path = Path(name)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise ValueError("release input is not a singly linked regular working file")
                  content = subprocess.check_output(["git", "cat-file", "blob", objects[name]])
                  prepared.append((path, info, content))
              # Validate the complete inventory and read all immutable blobs before
              # any write. Never normalize other files, create a missing input or
              # run smudge/textconv filters while materializing these eight paths.
              for path, info, content in prepared:
                  with path.open("r+b") as handle:
                      current = os.fstat(handle.fileno())
                      if (not stat.S_ISREG(current.st_mode) or current.st_nlink != 1
                              or (current.st_dev, current.st_ino) != (info.st_dev, info.st_ino)):
                          raise ValueError("release input identity changed before materialization")
                      if handle.read() != content:
                          handle.seek(0)
                          handle.write(content)
                          handle.truncate()

          if __name__ == "__main__":
              assert_source(os.environ["SOURCE_COMMIT"])
              materialize_release_inputs(os.environ["SOURCE_COMMIT"])

