      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Download common release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-verify-inputs-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: release-inputs

      - name: Build locked release binary
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --no-default-features --target $env:TARGET `
            -p agent-session-grep-cli -p agent-session-grep-launcher `
            --bin agent-session-grep --bin agent-session-grep-launcher --bin asg-supervisor
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Verify exact binary version
        id: verify_binary
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path

          def validate_binary_version(reported, version):
              expected = "agent-session-grep " + version
              if reported not in (expected, expected + "\n", expected + "\r\n"):
                  raise ValueError("binary version does not exactly match the prepared version")

          if __name__ == "__main__":
              binary = Path("target", os.environ["TARGET"], "release", os.environ["BINARY"]).resolve(strict=True)
              validate_binary_version(subprocess.check_output([str(binary), "--version"], text=True), os.environ["VERSION"])

      - name: Synthetic release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path -LiteralPath "target/$env:TARGET/release/$env:BINARY").Path
          python scripts/verify-release.py --asg $binary

      - name: Build deterministic unsigned archive and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path -LiteralPath "target/$env:TARGET/release/$env:BINARY").Path
          $suffix = [IO.Path]::GetExtension($env:BINARY)
          $launcher = (Resolve-Path -LiteralPath "target/$env:TARGET/release/agent-session-grep-launcher$suffix").Path
          $supervisor = (Resolve-Path -LiteralPath "target/$env:TARGET/release/asg-supervisor$suffix").Path
          # In release-verify the v<version> string is only an archive component;
          # packaging never creates a Git ref or a GitHub Release.
          python scripts/release/build-manifest.py package `
            --workspace . --binary $binary --managed-layout --launcher $launcher --supervisor $supervisor `
            --schemas-from-source --git-package-inputs --verify-native `
            --dependency-json 'release-inputs/THIRD-PARTY-DEPENDENCIES.json' `
            --dependency-csv 'release-inputs/THIRD-PARTY-DEPENDENCIES.csv' `
            --target $env:TARGET --tag $env:RELEASE_TAG --version $env:VERSION `
            --source-commit $env:SOURCE_COMMIT --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --archive-format $env:ARCHIVE_FORMAT --output-dir dist

      - name: Write target artifact checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release/build-manifest.py checksums `
            --directory dist --output dist/SHA256SUMS

      - name: Upload unsigned target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verify-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: validate complete four-target unsigned bundle
    needs: [prepare, quality, build]
    runs-on: ubuntu-22.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      CARGO_LOCK_SHA256: ${{ needs.prepare.outputs.cargo_lock_sha256 }}
      ARTIFACT_PREFIX: release-verify-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

