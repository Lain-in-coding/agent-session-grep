        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download separate target artifacts without merging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-verify-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}-*
          path: artifacts
          merge-multiple: false

      - name: Download common dependency inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-verify-inputs-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: release-inputs

      - name: Validate target inventories before assembling
        id: assemble_artifacts
        shell: python {0}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          def validate_version(value):
