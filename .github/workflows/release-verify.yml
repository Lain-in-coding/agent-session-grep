name: release-verify

# Verifies the release build path for the current commit on the three
# operating systems without creating a tag, a GitHub Release, or any other
# published artifact. The tag-driven release.yml is the only publishing
# workflow; this one exists because release.yml cannot run until an owner
# pushes a v* tag, so the build/test/package/checksum chain would otherwise
# never be exercised or downloadable for a commit under review.
#
# Boundary: everything this workflow uploads is an unsigned GitHub Actions
# artifact with a retention window, not a release asset. The archive names
# follow the same packaging helper as a real release, so read the artifact
# name (release-verify-<commit>-<target>) and the unsigned provenance block
# inside each manifest before assuming anything about its status.
#
# Windows MSVC additionally runs a CRT-static RUSTFLAGS build. The tag-driven
# release.yml matrix still builds both macOS architectures; this verification
# matrix deliberately keeps one runner per OS family to bound runner minutes.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/release/**"
      - "scripts/install/**"
      - "scripts/verify-release.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/release/**"
      - "scripts/install/**"
      - "scripts/verify-release.py"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  # The test half of the loop is the existing required CI gate, unchanged and
  # not duplicated: three-OS fmt/clippy/test plus the installer smoke job.
  quality:
    name: required CI quality gates
    uses: ./.github/workflows/ci.yml

  prepare:
    name: resolve verification inputs
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Resolve workspace version and source commit
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The verified commit is the checked-out commit itself (for a pull
          # request that is the merge commit GitHub built), never a tag.
          $commit = (git rev-parse HEAD).Trim()
          $epoch = (git show -s --format=%ct HEAD).Trim()
          $inSection = $false
          $version = $null
          foreach ($line in Get-Content 'Cargo.toml') {
            if ($line -match '^\s*\[') {
              $inSection = $line -match '^\s*\[workspace\.package\]\s*$'
              continue
            }
            if ($inSection -and $line -match '^\s*version\s*=\s*"([^"]+)"\s*$') {
              $version = $Matches[1]
              break
            }
          }
          if (-not $version) {
            throw 'Cargo.toml must declare exactly one [workspace.package] version'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_date_epoch=$epoch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate locked metadata and dependency inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path 'release-inputs' | Out-Null
          cargo metadata --locked --format-version 1 |
            Set-Content -Encoding utf8NoBOM -Path 'release-inputs/cargo-metadata.json'
          python scripts/release/build-manifest.py inventory `
            --workspace . `
            --metadata 'release-inputs/cargo-metadata.json' `
            --version '${{ steps.source.outputs.version }}' `
            --output-dir 'release-inputs'
          Remove-Item 'release-inputs/cargo-metadata.json'
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Upload verification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verify-inputs-${{ github.sha }}
          path: |
            release-inputs/THIRD-PARTY-DEPENDENCIES.json
            release-inputs/THIRD-PARTY-DEPENDENCIES.csv
          if-no-files-found: error
          retention-days: 30

  build:
    name: verify ${{ matrix.target }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: agent-session-grep.exe
            archive_format: zip
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: agent-session-grep
            archive_format: tar.gz
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: agent-session-grep
            archive_format: tar.gz
            rustflags: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Download verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-verify-inputs-${{ github.sha }}
          path: release-inputs

      # Same flags as release.yml: --locked pins Cargo.lock, --no-default-features
      # pins the shipped feature set (today the default set is empty), and
      # --target pins the exact triple.
      - name: Build locked release binary
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --no-default-features --target '${{ matrix.target }}' `
            -p agent-session-grep-cli --bin agent-session-grep
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Synthetic release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path (Join-Path 'target/${{ matrix.target }}/release' '${{ matrix.binary }}')).Path
          python scripts/verify-release.py --asg $binary

      - name: Package unsigned verification archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = (Resolve-Path (Join-Path 'target/${{ matrix.target }}/release' '${{ matrix.binary }}')).Path
          # The archive is only as trustworthy as the version it claims: fail
          # closed when the binary and the workspace version disagree.
          $reported = (& $binary --version | Out-String).Trim()
          if (-not $reported.Contains('${{ needs.prepare.outputs.version }}')) {
            throw "built binary reports '$reported' but Cargo.toml declares ${{ needs.prepare.outputs.version }}"
          }
          # The packaging helper requires tag == v<version>; the tag string is
          # the archive-name component only. No ref or GitHub Release is
          # created by this workflow.
          python scripts/release/build-manifest.py package `
            --workspace . `
            --binary $binary `
            --dependency-json 'release-inputs/THIRD-PARTY-DEPENDENCIES.json' `
            --dependency-csv 'release-inputs/THIRD-PARTY-DEPENDENCIES.csv' `
            --target '${{ matrix.target }}' `
            --tag 'v${{ needs.prepare.outputs.version }}' `
            --version '${{ needs.prepare.outputs.version }}' `
            --source-commit '${{ needs.prepare.outputs.source_commit }}' `
            --source-date-epoch '${{ needs.prepare.outputs.source_date_epoch }}' `
            --archive-format '${{ matrix.archive_format }}' `
            --output-dir dist

      - name: Write and re-verify SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release/build-manifest.py checksums `
            --directory dist `
            --output dist/SHA256SUMS
          # Fail closed when the written list does not match the bytes on disk.
          $listed = 0
          foreach ($line in Get-Content 'dist/SHA256SUMS') {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "malformed SHA256SUMS line: $line"
            }
            $expected = $Matches[1]
            $name = $Matches[2]
            $actual = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "sha256 mismatch for $name"
            }
            $listed++
          }
          if ($listed -lt 2) {
            throw "SHA256SUMS should cover the archive and its manifest; covered $listed files"
          }

      - name: Upload unsigned verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verify-${{ github.sha }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
