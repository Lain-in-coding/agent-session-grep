name: ci

on:
  workflow_call:
    inputs:
      source_commit:
        description: "Exact nonzero full source SHA prepared by the caller"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: validate exact CI source
    runs-on: ubuntu-latest
    steps:
      - name: Validate required source SHA
        id: source
        shell: python {0}
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os

          if __name__ == "__main__":
              validate_source_commit(os.environ["SOURCE_COMMIT"])

  test:
    name: test (${{ matrix.os }})
    needs: [source]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Assert exact source checkout
        id: assert_source
        shell: python {0}
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os
          import subprocess

          def assert_source(source_commit):
              expected = validate_source_commit(source_commit)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise ValueError("checkout HEAD does not match prepared source_commit")

          if __name__ == "__main__":
              assert_source(os.environ["SOURCE_COMMIT"])

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache cargo registry and target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The embedded client has no npm dependencies. Node's built-in runner
      # exercises the shipped script against delayed synthetic API responses.
      - name: Web client interaction tests
        run: node --test crates/agent-session-grep-cli/tests/web_ui.test.cjs

      # The semantic-candle module is behind a cargo feature, so the default
      # `cargo test --workspace` never compiles it. Run its suite explicitly
      # to keep the feature inside the quality gate; the feature only builds
      # the local candle runtime and downloads no model weights.
      - name: Test semantic-candle feature
        run: cargo test -p agent-session-grep-application --features semantic-candle

      - name: Check semantic-candle entrypoints
        run: cargo check -p agent-session-grep-cli --all-targets --features semantic-candle

      - name: Robot contract tests
        run: cargo test -p agent-session-grep-cli --test e2e robot_ -- --nocapture

      # Python helper suites are stdlib-only unittest and hermetic: synthetic
      # fixtures, no network, no real transcripts. Each scripts/ directory is
      # discovered separately because they are not importable packages, so
      # discovery does not recurse into them.
      - name: Release verifier and entry-point tests
        shell: bash
        env:
          AGENT_SESSION_GREP_REQUIRE_NATIVE_BASH: "1"
        run: |
          bash_executable="$BASH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # MSYS may omit .exe in BASH; export the actual native executable.
            bash_executable="$(cygpath -am "${BASH%.exe}.exe")"
          fi
          export AGENT_SESSION_GREP_TEST_BASH="$bash_executable"
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Release manifest tests
        run: python -m unittest discover -s scripts/release -p "test_*.py" -v

      # Benchmark, open-source gate, privacy scan, and the regression harness'
      # pure-function suite. The installer job re-runs the regression harness
      # with a release binary present, which unlocks its binary-backed cases.
      - name: Evidence harness tests
        run: python -m unittest discover -s scripts/evidence -p "test_*.py" -v

  installer:
    name: installer smoke (${{ matrix.os }})
    needs: [source]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Assert exact source checkout
        id: assert_source
        shell: python {0}
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          import os
          import subprocess

          def assert_source(source_commit):
              expected = validate_source_commit(source_commit)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise ValueError("checkout HEAD does not match prepared source_commit")

          if __name__ == "__main__":
              assert_source(os.environ["SOURCE_COMMIT"])

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache cargo registry and target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-installer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-installer-

      - name: Build release binary
        run: cargo build --locked --release -p agent-session-grep-cli

      # Installer scripts only copy an already-built artifact here (--skip-build):
      # the build step above is the reproducible one, and CI must not hide a
      # build failure inside the installer.
      - name: Install into a workspace-local prefix (unix)
        if: runner.os != 'Windows'
        run: ./scripts/install/install.sh --skip-build --prefix "$PWD/ci-prefix"

      - name: Install into a workspace-local prefix (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/install.ps1 -SkipBuild -Prefix "$PWD/ci-prefix"

      - name: Invoke both installed commands (unix)
        if: runner.os != 'Windows'
        run: |
          ./ci-prefix/agent-session-grep --version
          ./ci-prefix/asg --version
          ./ci-prefix/agent-session-grep --robot config paths
          ./ci-prefix/asg --robot config paths

      - name: Invoke both installed commands (windows)
        id: invoke_installed
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import subprocess

          def invoke_installed_commands():
              # Check each native exit, not only PowerShell's final LASTEXITCODE.
              for arguments in (["--version"], ["--robot", "config", "paths"]):
                  for binary in ("agent-session-grep.exe", "asg.exe"):
                      subprocess.run(["./ci-prefix/" + binary, *arguments], check=True)

          if __name__ == "__main__":
              invoke_installed_commands()

      # End-to-end surface smoke against the installed artifact: CLI robot
      # envelopes, documented exit codes, and the MCP stdio handshake.
      - name: Surface smoke (unix)
        if: runner.os != 'Windows'
        run: ./scripts/install/smoke.sh --binary "$PWD/ci-prefix/agent-session-grep" --alias-binary "$PWD/ci-prefix/asg"

      - name: Surface smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/smoke.ps1 -Binary "$PWD/ci-prefix/agent-session-grep.exe" -AliasBinary "$PWD/ci-prefix/asg.exe"

      # Uninstall must remove exactly the two installer-owned command files and
      # stay idempotent: a second run reports "not installed" and exits 0.
      - name: Uninstall twice (unix)
        if: runner.os != 'Windows'
        run: |
          ./scripts/install/uninstall.sh --prefix "$PWD/ci-prefix"
          test ! -e "$PWD/ci-prefix/agent-session-grep"
          test ! -e "$PWD/ci-prefix/asg"
          test ! -L "$PWD/ci-prefix/asg"
          ./scripts/install/uninstall.sh --prefix "$PWD/ci-prefix"

      - name: Uninstall twice (windows)
        id: uninstall_twice
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import subprocess
          from pathlib import Path

          def uninstall_twice():
              prefix = Path("ci-prefix").resolve()
              command = ["pwsh", "-NoProfile", "-NonInteractive", "-File",
                         "./scripts/install/uninstall.ps1", "-Prefix", str(prefix)]
              subprocess.run(command, check=True)
              if any((prefix / name).exists() for name in ("agent-session-grep.exe", "asg.exe")):
                  raise ValueError("uninstall left an installed command behind")
              subprocess.run(command, check=True)

          if __name__ == "__main__":
              uninstall_twice()

      # Regression harness self-test runs on synthetic fixtures only; real
      # transcripts are never present in CI.
      - name: Regression harness self-test
        run: python -m unittest discover -s scripts/evidence -p "test_real_data_regression.py" -v

  # One supply-chain implementation, also usable by scheduled/manual audits.
  security:
    name: required security audit
    needs: [source]
    uses: ./.github/workflows/security-audit.yml
    with:
      source_commit: ${{ inputs.source_commit }}

  gate:
    name: all required quality checks
    if: always()
    needs: [source, test, installer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality result and matrix member
        id: gate
        shell: python {0}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON field")
                  result[key] = value
              return result

          def api_get(path, allow_not_found=False):
              if not path.startswith("/repos/") or "#" in path:
                  raise ValueError("unexpected GitHub API path")
              request = urllib.request.Request(
                  os.environ["GITHUB_API_URL"].rstrip("/") + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError("unexpected GitHub API status")
                      data = json.loads(response.read(), object_pairs_hook=unique_object)
                      if not isinstance(data, (dict, list)):
                          raise ValueError("malformed GitHub API JSON root")
                      return data
              except urllib.error.HTTPError as error:
                  if allow_not_found and error.code == 404:
                      return None
                  raise ValueError(f"GitHub API returned HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError):
                  raise ValueError("GitHub API request failed") from None

          def require_success(needs, expected):
              if not expected or len(set(expected)) != len(expected):
                  raise ValueError("required job inventory is empty or duplicated")
              if not isinstance(needs, dict) or set(needs) != set(expected):
                  raise ValueError("required job result inventory is incomplete")
              for name in expected:
                  if not isinstance(needs[name], dict) or needs[name].get("result") != "success":
                      raise ValueError("required job did not succeed: " + name)

          def load_jobs(api, repo, run_id, run_attempt):
              result, seen, total = [], set(), None
              page = 1
              while total is None or len(result) < total:
                  data = api(f"/repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100&page={page}")
                  if not isinstance(data, dict) or type(data.get("total_count")) is not int or data["total_count"] < 0:
                      raise ValueError("invalid job pagination metadata")
                  if total is not None and total != data["total_count"]:
                      raise ValueError("job inventory changed while paginating")
                  total = data["total_count"]
                  batch = data.get("jobs")
                  if not isinstance(batch, list) or len(batch) > 100 or (not batch and len(result) != total):
                      raise ValueError("incomplete job pagination")
                  for job in batch:
                      if not isinstance(job, dict) or type(job.get("id")) is not int or job["id"] <= 0 or job["id"] in seen:
                          raise ValueError("invalid or duplicate job record")
                      seen.add(job["id"])
                  result.extend(batch)
                  if len(result) > total:
                      raise ValueError("job count exceeds declared total")
                  page += 1
              return result

          import re

          def validate_source_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("source_commit must be a nonzero full lowercase Git SHA")
              return value

          def expected_api_head(event_name, event, caller_sha):
              caller_sha = validate_source_commit(caller_sha)
              if not isinstance(event, dict):
                  raise ValueError("caller event must be an object")
              if event_name == "pull_request":
                  pull_request = event.get("pull_request")
                  if not isinstance(pull_request, dict) or not isinstance(pull_request.get("head"), dict):
                      raise ValueError("PR event is missing its head identity")
                  # The API describes the PR branch head H, while checkout/test uses the
                  # event's synthetic merge commit M. Neither is a fallback for the other.
                  return validate_source_commit(pull_request["head"].get("sha"))
              if event_name not in {"push", "workflow_dispatch", "schedule"}:
                  raise ValueError("unsupported caller event for API job identity")
              return caller_sha

          def required_step_names(name):
              source = ["Checkout exact source", "Assert exact source checkout"]
              if name == "validate exact CI source":
                  return ["Validate required source SHA"]
              if name == "resolve audit source":
                  return ["Resolve exact audit source"]
              if name == "all required quality checks":
                  return ["Require every quality result and matrix member"]
              if name.startswith("test ("):
                  return source + ["Install Rust toolchain", "Install Python", "Cache cargo registry and target",
                      "Format check", "Clippy", "Test", "Web client interaction tests", "Test semantic-candle feature",
                      "Check semantic-candle entrypoints", "Robot contract tests", "Release verifier and entry-point tests",
                      "Release manifest tests", "Evidence harness tests"]
              if name.startswith("installer smoke ("):
                  platform = "windows" if name == "installer smoke (windows-latest)" else "unix"
                  return source + ["Install Rust toolchain", "Install Python", "Cache cargo registry and target", "Build release binary",
                      f"Install into a workspace-local prefix ({platform})", f"Invoke both installed commands ({platform})",
                      f"Surface smoke ({platform})", f"Uninstall twice ({platform})", "Regression harness self-test"]
              if name == "Cargo dependency audit":
                  return source + ["Install pinned audit tools", "Verify committed lockfile", "Check dependency policy",
                                   "Check zero-egress static audit", "Check RustSec advisories"]
              if name.startswith(("build ", "verify ")):
                  return source + ["Install Python", "Install Rust toolchain", "Download common release inputs", "Build locked release binary",
                                  "Verify exact binary version", "Synthetic release smoke", "Build deterministic unsigned archive and manifest",
                                  "Write target artifact checksums", "Upload unsigned target artifact"]
              if name == "resolve exact source and release inputs":
                  return ["Resolve exact prepared source", *source, "Install Python", "Install Rust toolchain",
                          "Validate workspace version and immutable inputs", "Generate locked metadata and dependency inventory",
                          "Upload common release inputs"]
              if name == "validate complete four-target unsigned bundle":
                  return source + ["Install Python", "Download separate target artifacts without merging", "Download common dependency inventory",
                                  "Validate target inventories before assembling", "Write complete bundle checksums with the existing helper",
                                  "Verify all bundle bytes and unsigned provenance", "Upload complete temporary unsigned bundle"]
              raise ValueError("unknown required job step contract")

          def require_steps(job, expected):
              steps = job.get("steps")
              if not isinstance(steps, list) or not expected or len(set(expected)) != len(expected):
                  raise ValueError("required step inventory is missing or invalid")
              numbers, found = set(), {name: [] for name in expected}
              for step in steps:
                  if (not isinstance(step, dict) or not isinstance(step.get("name"), str)
                          or type(step.get("number")) is not int or step["number"] <= 0 or step["number"] in numbers):
                      raise ValueError("malformed or duplicate step record")
                  numbers.add(step["number"])
                  if step["name"] in found:
                      found[step["name"]].append(step)
              for name, matches in found.items():
                  if len(matches) != 1 or matches[0].get("status") != "completed" or matches[0].get("conclusion") != "success":
                      raise ValueError("required command step is missing, duplicated or non-success: " + name)

          def require_jobs(jobs, expected, run_id, run_attempt, caller_sha):
              import re
              if (not isinstance(caller_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", caller_sha)
                      or caller_sha == "0" * 40 or type(run_id) is not int or run_id <= 0
                      or type(run_attempt) is not int or run_attempt <= 0):
                  raise ValueError("invalid caller run identity")
              if not isinstance(jobs, list) or not expected or len(set(expected)) != len(expected):
                  raise ValueError("invalid required matrix inventory")
              found = {name: [] for name in expected}
              seen = set()
              for job in jobs:
                  if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                      raise ValueError("malformed workflow job")
                  if type(job.get("id")) is not int or job["id"] <= 0 or job["id"] in seen:
                      raise ValueError("invalid or duplicate workflow job ID")
                  seen.add(job["id"])
                  leaf = job["name"].split(" / ")[-1]
                  if leaf in found:
                      prefixes = [""]
                      if leaf.startswith(("test (", "installer smoke (")) or leaf in {"validate exact CI source", "all required quality checks"}:
                          prefixes.append("required CI quality gates / ")
                      elif leaf in {"Cargo dependency audit", "resolve audit source"}:
                          prefixes.extend(["required security audit / ",
                                           "required CI quality gates / required security audit / "])
                      if job["name"] not in {prefix + leaf for prefix in prefixes}:
                          raise ValueError("unexpected reusable job name prefix")
                      found[leaf].append(job)
              for name, matches in found.items():
                  if len(matches) != 1:
                      raise ValueError("required matrix job missing or duplicated: " + name)
                  job = matches[0]
                  if (type(job.get("run_id")) is not int or job["run_id"] != run_id
                          or type(job.get("run_attempt")) is not int or job["run_attempt"] != run_attempt
                          or job.get("head_sha") != caller_sha
                          or job.get("status") != "completed" or job.get("conclusion") != "success"):
                      raise ValueError("required matrix job is stale or non-success: " + name)
                  require_steps(job, required_step_names(name))

          if __name__ == "__main__":
              require_success(json.loads(os.environ["NEEDS_JSON"]), ["source", "test", "installer", "security"])
              run_id, attempt = int(os.environ["GITHUB_RUN_ID"]), int(os.environ["GITHUB_RUN_ATTEMPT"])
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file, object_pairs_hook=unique_object)
              api_head = expected_api_head(os.environ["EVENT_NAME"], event, os.environ["GITHUB_SHA"])
              expected = [f"{kind} ({runner})" for kind in ("test", "installer smoke")
                          for runner in ("ubuntu-latest", "windows-latest", "macos-latest")]
              expected.extend(["Cargo dependency audit", "validate exact CI source", "resolve audit source"])
              require_jobs(load_jobs(api_get, os.environ["GITHUB_REPOSITORY"], run_id, attempt), expected, run_id, attempt, api_head)
