name: security-audit

"on":
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned audit tools
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit

      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check dependency policy
        run: cargo deny check

      - name: Check zero-egress static audit
        # 零遥测审计：默认 build 不得依赖 HTTP client，唯一 socket 是 serve 的
        # loopback TcpListener。
        # 与 crates/agent-session-grep-cli/tests/network_egress.rs 同一语义，此处用
        # grep 作 CI 前置快速闸门（不依赖 cargo build）。
        run: |
          set -euo pipefail
          for crate in reqwest hyper ureq isahc surf attohttpc tiny_http rouille warp axum tokio async-std; do
            if grep -q "^name = \"${crate}\"" Cargo.lock; then
              echo "zero-egress audit failed: HTTP client dependency ${crate} found in Cargo.lock" >&2
              exit 1
            fi
          done
          sockets=$(grep -rlE 'TcpListener|TcpStream|TcpSocket|UdpSocket|std::net' crates --include='*.rs' | grep '/src/' | grep -v 'crates/agent-session-grep-cli/src/serve.rs' || true)
          if [ -n "${sockets}" ]; then
            echo "zero-egress audit failed: socket usage outside serve.rs:" >&2
            echo "${sockets}" >&2
            exit 1
          fi

      - name: Check RustSec advisories
        run: cargo audit --file Cargo.lock
