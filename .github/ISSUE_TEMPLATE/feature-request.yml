name: Feature request
description: Propose a privacy-safe improvement to agent-session-grep.
title: "[Feature]: "
labels:
  - enhancement
  - privacy
body:
  - type: markdown
    attributes:
      value: |
        **Privacy reminder:** Do not paste a real transcript, secret, credential, absolute personal path, or provider database content here. Use a synthetic fixture and include only the project version/commit and safe diagnostics. Feature proposals must preserve the local-first, read-only source boundary.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve? Keep examples synthetic and privacy-safe.
      placeholder: Describe the workflow or limitation without real session content.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired behavior, user-facing contract, and any provider or capability impact.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the released version or development version where you observed the need.
      placeholder: v0.3.0 or 0.3.x
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Provide the 40-character commit SHA when reporting a development build.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: textarea
    id: synthetic_fixture
    attributes:
      label: Synthetic fixture or evidence
      description: Describe a minimal synthetic fixture, golden case, or benchmark evidence that demonstrates the need. Never upload a real transcript.
      placeholder: Explain the invented records, expected canonical events, or reproducible measurement.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you consider?

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope confirmation
      options:
        - label: I used synthetic or irreversibly redacted examples and did not include a real transcript, secret, credential, or personal path.
          required: true
        - label: I understand that new provider capabilities need manifest, fixture/provenance, license, and privacy review.
          required: true
