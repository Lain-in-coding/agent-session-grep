[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "Github_src"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
blake3 = "1.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
# Optional local semantic stack (feature semantic-candle). Pinned to versions
# already present in the local cargo registry so offline builds stay hermetic.
# No hf-hub / reqwest / tokio: model weights are imported from a local bundle only.
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
safetensors = "0.4.5"

# Release profile rationale (2026-08-15, task 08-15 open-source-product-roadmap).
# Peer evidence — borrowable-code-inventory.md §9 "Don't Borrow", verified against
# the fixed competitor clones (memex @9a88a5c, hstry @88b78b1):
#   * hstry: opt-level="z" + lto=true + codegen-units=1 + panic="abort" + strip=true.
#     panic="abort" is NOT adopted: it sacrifices unwinding — no catch_unwind,
#     no Drop cleanup on panic, and buffered stderr diagnostics can be lost.
#     This CLI, its stdio MCP server, and the TUI all run in-process.
#   * memex: opt-level="s" + lto="thin" + codegen-units=4 + strip=true (panic left
#     at the default unwind). Size-first opt-level="s"/"z" is NOT adopted either:
#     this is a search/query tool whose hot path (FTS scans, JSONL capture,
#     fingerprinting, commit batches) is latency-bound, and transcripts are small.
# Adopted balance: latency-first optimization, unwinding preserved, thin install.
[profile.release]
opt-level = 3        # latency-first -O3; reject "z"/"s" (hstry/memex are size-first caches, not query tools)
lto = "thin"         # cross-crate inlining across the 8 workspace crates; thin keeps build time/memory sane (memex thin, hstry fat)
codegen-units = 1    # per-crate max optimization; the workspace crates are small, so the single-unit compile cost is acceptable (hstry 1, memex 4)
panic = "unwind"     # keep unwinding — deliberate divergence from hstry's panic="abort" (don't-borrow §9)
strip = "debuginfo"  # measured 2026-08-15: same binary size as strip=true (3,817,984 B) on MSVC, but keeps symbol names so RUST_BACKTRACE=1 stays actionable; panic messages keep their compile-time file:line either way
