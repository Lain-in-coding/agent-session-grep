[package]
name = "sqlite-snapshot-wal-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "R0 可丢弃探针：验证 WAL 一致快照、旧 generation 只读打开与 Windows rename 语义。不进 crates/。"

# 独立 workspace，避免被父目录意外纳入
[workspace]

[[bin]]
name = "sqlite-snapshot-wal-spike"
path = "src/main.rs"

[dependencies]
# 版本与 search-backend spike 对齐（fast-resume 已验证 0.40 bundled 可用）。
# backup feature 提供 SQLite Online Backup API，用于一致快照。
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
anyhow = "1.0"
tempfile = "3"
